<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="A pop-art comic-book banner for San Diego Comic-Con 2026, with a starburst, halftone dots, and speech bubbles">
  <defs>
    <linearGradient id="scSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9d6a3"/>
      <stop offset="55%" stop-color="#f7b98f"/>
      <stop offset="100%" stop-color="#f2a09a"/>
    </linearGradient>
    <radialGradient id="scBurst" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ffcf4d"/>
    </radialGradient>
    <pattern id="scDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="5" fill="#e07a5f" opacity="0.30"/>
    </pattern>
  </defs>

  <!-- warm sky -->
  <rect width="1200" height="600" fill="url(#scSky)"/>
  <!-- halftone dot field -->
  <rect width="1200" height="600" fill="url(#scDots)"/>

  <!-- radiating action lines behind the burst -->
  <g stroke="#c0392b" stroke-width="10" opacity="0.16" stroke-linecap="round">
    <line x1="600" y1="300" x2="120" y2="60"/>
    <line x1="600" y1="300" x2="600" y2="30"/>
    <line x1="600" y1="300" x2="1080" y2="60"/>
    <line x1="600" y1="300" x2="60" y2="300"/>
    <line x1="600" y1="300" x2="1140" y2="300"/>
    <line x1="600" y1="300" x2="180" y2="560"/>
    <line x1="600" y1="300" x2="1020" y2="560"/>
    <line x1="600" y1="300" x2="380" y2="20"/>
    <line x1="600" y1="300" x2="820" y2="20"/>
  </g>

  <!-- pop-art starburst badge -->
  <g transform="translate(600,300)">
    <path fill="url(#scBurst)" stroke="#1f2a44" stroke-width="8" stroke-linejoin="round"
      d="M0 -250 L44 -150 L150 -190 L120 -78 L245 -70 L150 0 L245 70 L120 78 L150 190 L44 150 L0 250 L-44 150 L-150 190 L-120 78 L-245 70 L-150 0 L-245 -70 L-120 -78 L-150 -190 L-44 -150 Z"/>
  </g>

  <!-- lettering inside the burst -->
  <text x="600" y="212" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="46" font-weight="800" letter-spacing="8" fill="#c0392b">SAN DIEGO</text>
  <text x="600" y="298" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="74" font-weight="800" letter-spacing="1" fill="#1f2a44">COMIC-CON</text>
  <text x="600" y="392" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="96" font-weight="800" letter-spacing="6" fill="#c0392b">2026</text>

  <!-- speech bubble: POW! -->
  <g transform="translate(196,150)">
    <path fill="#ffffff" stroke="#1f2a44" stroke-width="6" stroke-linejoin="round"
      d="M-96 -46 Q-110 -46 -110 -28 L-110 30 Q-110 48 -92 48 L-30 48 L-6 84 L-2 48 L92 48 Q110 48 110 30 L110 -28 Q110 -46 92 -46 Z"/>
    <text x="0" y="18" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="58" font-weight="800" fill="#c0392b">POW!</text>
  </g>

  <!-- speech bubble: BAM! -->
  <g transform="translate(1004,150)">
    <path fill="#1f2a44" stroke="#1f2a44" stroke-width="6" stroke-linejoin="round"
      d="M-96 -46 Q-110 -46 -110 -28 L-110 30 Q-110 48 -92 48 L-2 48 L6 84 L30 48 L92 48 Q110 48 110 30 L110 -28 Q110 -46 92 -46 Z"/>
    <text x="0" y="18" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="58" font-weight="800" fill="#ffe9a8">BAM!</text>
  </g>

  <!-- little sparks in the lower corners -->
  <g fill="#ffffff" stroke="#1f2a44" stroke-width="4" stroke-linejoin="round">
    <path d="M150 500 l14 34 l34 14 l-34 14 l-14 34 l-14 -34 l-34 -14 l34 -14 Z"/>
    <path d="M1050 500 l12 28 l28 12 l-28 12 l-12 28 l-12 -28 l-28 -12 l28 -12 Z"/>
  </g>

  <!-- comic panel border -->
  <rect x="14" y="14" width="1172" height="572" fill="none" stroke="#1f2a44" stroke-width="12"/>
</svg>
